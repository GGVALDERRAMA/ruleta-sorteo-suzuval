<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Ruleta</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container { max-width: 800px; margin: 0 auto; width: 100%; }
        .table-wrapper { background: rgba(255,255,255,0.95); border-radius: 12px; overflow: hidden; margin-top: 20px;}
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: var(--color-primary); color: white; }
        td { font-size: 14px; }
        .actions { margin-top: 20px; display: flex; gap: 10px;}
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="glass-panel active">
            <h2>Panel de Administración</h2>
            <p>Configura los premios y gestiona el inventario.</p>
            

            <div class="input-group">
                <label>Fondo de Pantalla de la Ruleta (URL o Base64)</label>
                <input type="text" id="bg-url" placeholder="URL de la imagen o dejar en blanco para default">
            </div>

            <button id="btn-guardar-config" class="btn-primary" style="margin-bottom: 30px;">Guardar Configuración</button>

            <h3>Inventario de Premios</h3>
            
            <!-- FORMULARIO PARA AGREGAR PREMIO -->
            <form id="form-agregar-premio" style="display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap;">
                <div class="input-group" style="margin-bottom: 0; flex: 1;">
                    <label>ID</label>
                    <input type="number" id="nuevo-id" required placeholder="Ej: 4">
                </div>
                <div class="input-group" style="margin-bottom: 0; flex: 2;">
                    <label>Nombre del Premio</label>
                    <input type="text" id="nuevo-nombre" required placeholder="Ej: Casco">
                </div>
                <div class="input-group" style="margin-bottom: 0; flex: 1;">
                    <label>Stock</label>
                    <input type="number" id="nuevo-stock" required placeholder="Ej: 10">
                </div>
                <div class="input-group" style="margin-bottom: 0; flex: 2;">
                    <label>Imagen del Premio (Desde tu PC)</label>
                    <input type="file" id="nuevo-imagen-file" accept="image/png, image/jpeg, image/webp" style="padding: 11px;">
                </div>
                <button type="submit" class="btn-primary" style="flex: 1; padding: 14px;">Agregar</button>
            </form>

            <div class="table-wrapper">
                <table id="premios-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Premio</th>
                            <th>Stock Disponible</th>
                        </tr>
                    </thead>
                    <tbody id="premios-body">
                        <!-- Llenado dinámicamente -->
                    </tbody>
                </table>
            </div>
            
            <div class="actions">
                <button id="btn-cargar-mas" class="btn-primary" style="background:#64748b;">Cargar más (10)</button>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
